<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planeringstavla</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--accent:#2563eb;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
  height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem
}
.hdr-title{font-size:1rem;font-weight:700;letter-spacing:-.02em}
.board{
  display:flex;gap:.875rem;padding:1rem;
  overflow-x:auto;overflow-y:hidden;
  height:calc(100dvh - 56px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))
}
.col{flex:0 0 195px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;max-height:100%}
.col-hdr{display:flex;align-items:center;gap:.5rem;padding:.75rem;border-bottom:1px solid var(--border);flex-shrink:0}
.col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.col-name{font-size:.75rem;font-weight:600;flex:1}
.col-cnt{font-size:.7rem;background:var(--border);color:var(--muted);border-radius:10px;padding:1px 6px}
